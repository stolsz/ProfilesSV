<!DOCTYPE html>
<html>
<head>
    <title>Leaflet Map with GeoJSON</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chroma-js/2.4.2/chroma.min.js"></script>

    <link rel="stylesheet" href="https://unpkg.com/leaflet-groupedlayercontrol@0.6.1/src/leaflet.groupedlayercontrol.css" />
    <script src="https://unpkg.com/leaflet-groupedlayercontrol@0.6.1/src/leaflet.groupedlayercontrol.js"></script>
    
    <style>
        /* MODIFICATION: Made map full-screen and removed default body margin */
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif; /* Added Inter font */
        }
        #map { 
            height: 100%; /* Changed from 1000px to 100% */
        }

        /* Styles for the custom legend */
        .info {
            padding: 6px 8px;
            font: 14px/16px Arial, Helvetica, sans-serif;
            background: white;
            background: rgba(255,255,255,0.8);
            box-shadow: 0 0 15px rgba(0,0,0,0.2);
            border-radius: 5px;
        }
        .info h4 {
            margin: 0 0 5px;
            color: #777;
        }
        .legend-item {
            display: flex;
            align-items: center;
            margin-bottom: 4px;
        }
        .legend-color {
            width: 18px;
            height: 18px;
            margin-right: 8px;
            border: 1px solid #ccc; /* Added border for better visibility */
        }
        .legend-label {
            white-space: nowrap;
        }
    </style>
</head>
<body>
    <div id="map"></div>

    <script>
        // Initialize the map
		// 
        var map = L.map('map').setView([45.4201, -75.7003], 10);

        // Add OpenStreetMap as the base map layer
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
        }).addTo(map);

        // --- Reusable Function for Creating Layers ---

        // MODIFICATION: Created a reusable function to avoid repeating code for all the election result layers.
        function createElectionLayer(config) {
            return L.geoJSON(null, {
                style: function(feature) {
                    // Use a value of 0 if the property doesn't exist to prevent errors
                    var votePercentage = feature.properties[config.propertyName] || 0;
                    var colorScale = chroma.scale(config.colorScheme).domain([0, 1]);
                    return {
                        fillColor: colorScale(votePercentage).hex(),
                        color: '#333',
                        weight: 1,
                        opacity: 1,
                        fillOpacity: 0.65
                    };
                },
                onEachFeature: function (feature, layer) {
                    var votePercentage = feature.properties[config.propertyName] || 0;
                    // Format the percentage to two decimal places
                    var displayPercent = (votePercentage * 100).toFixed(2);
                    var popupContent = `<b>${config.title}</b><br>Vote: ${displayPercent}%`;
                    layer.bindPopup(popupContent);
                }
            });
        }
        
        // --- Layer Definitions ---

        var profilesLayer = L.geoJSON(null, {
            style: function(feature) {
                var indexVote = feature.properties.IndiceSupportAG;
                // Reverted to original color scheme and domain as per user's request
                var colorScale = chroma.scale(['white', 'purple']).domain([20, 60]); 
                return {
                    fillColor: colorScale(indexVote).hex(),
                    color: '#333', weight: 1, opacity: 1, fillOpacity: 0.5
                };
            },
            onEachFeature: function (feature, layer) {    
                if (feature.properties) {
                    var popupContent = '<table>';
                    for (var key in feature.properties) {
                        popupContent += `<tr><th style="padding-right:10px;">${key}</th><td>${feature.properties[key]}</td></tr>`;
                    }
                    popupContent += '</table>';
                    layer.bindPopup(popupContent, { maxWidth: 500, minWidth: 150 });
                }
            }
        });

        var decoupageLayer = L.geoJSON(null, {
            style: { fillColor: 'transparent', color: '#000000', weight: 2, opacity: 1 },
            onEachFeature: function (feature, layer) {
                if (feature.properties && feature.properties.NOM) {
                    layer.bindPopup(`<b>Secteur</b><br>${feature.properties.NOM}`);
                }
            }
        });

        var districtsLayer = L.geoJSON(null, {
            style: { fillColor: 'transparent', color: '#000000', weight: 2, dashArray: '5, 10', opacity: 1 },
            onEachFeature: function (feature, layer) {
                if (feature.properties && feature.properties.DISTRICT) {
                    layer.bindPopup(`<b>District Électoral</b><br>${feature.properties.DISTRICT}`);
                }
            }
        });
        
        var affectationLayer = L.geoJSON(null, {
            style: function (feature) {
                var type = feature.properties.TYPE;
                var color = 'gray'; // Default color
                switch (type) {
                    case 'Résidentielle': color = 'blue'; break;
                    case 'Commerciale artérielle': color = 'purple'; break;
                    case 'Industriel': color = 'red'; break;
                    case 'Récréative': color = 'lime'; break;
                    case 'Agricole': color = 'yellow'; break;
					case 'Rurale': color = 'yellow'; break;
					case 'Multifonctionnelle': color = 'orange'; break;
					case 'Économique spécialisée': color = 'red'; break;
					case 'Agricole de conservation': color = 'olive'; break;
					case 'Conservation': color = 'green'; break;
                    // MODIFICATION: Corrected bug here (was "color:", should be "color =")
                    default: color = 'gray';
                }
                return { fillColor: color, color: '#333', weight: 1, opacity: 0.7, fillOpacity: 0.5 };
            },
            onEachFeature: function (feature, layer) {
                if (feature.properties && feature.properties.TYPE) {
                    layer.bindPopup(`<b>Affectation Territoire</b><br>Type: ${feature.properties.TYPE}`);
                }
            }
        });
        
        // --- Layer Control Setup ---

        // MODIFICATION: Defined layers using the new reusable function
        // MODIFICATION: Changed "Profiles" to "Predicted Index Vote"
        var baseLayers = {

        };

        var groupedOverlays = {
            "Main Data Layers": {
                "Profiles": profilesLayer,
                "Affectation du territoire": affectationLayer
            },
			"Découpages": {
                "Secteurs Administratifs": decoupageLayer,
                "Districts Électoraux": districtsLayer
            },
            "Mairie 2024": {
                "Action Gatineau": createElectionLayer({ propertyName: "Mairie 2024 % Vote AG", colorScheme: ['#FFFFE0', '#FF4500'], title: "Résultats Mairie 2024 (AG)" }),
                "Adversaires": createElectionLayer({ propertyName: "Mairie 2024 % Vote Adversaire", colorScheme: ['#FFFFE0', '#4169E1'], title: "Résultats Mairie 2024 (Adversaires)" })
            },
            "Mairie 2021": {
                "Action Gatineau": createElectionLayer({ propertyName: "Mairie 2021 % Vote AG", colorScheme: ['#FFFFE0', '#FF4500'], title: "Résultats Mairie 2021 (AG)" }),
                "Adversaires": createElectionLayer({ propertyName: "Mairie 2021 % Vote Adversaire", colorScheme: ['#FFFFE0', '#4169E1'], title: "Résultats Mairie 2021 (Adversaires)" })
            },
            "Districts 2021": {
                "Action Gatineau": createElectionLayer({ propertyName: "Districts 2021 % Vote AG", colorScheme: ['#FFFFE0', '#FF4500'], title: "Résultats Districts 2021 (AG)" }),
                "Adversaires": createElectionLayer({ propertyName: "Districts 2021 % Vote Adversaires", colorScheme: ['#FFFFE0', '#4169E1'], title: "Résultats Districts 2021 (Adversaries)" })
            }
        };

        // MODIFICATION: Used the GroupedLayers plugin control and changed position to 'topleft'
        L.control.groupedLayers(baseLayers, groupedOverlays, { collapsed: false, position: 'topleft' }).addTo(map);

        // --- Add Default Layers and Load Data ---
        
        // Add layers that should be visible by default
        profilesLayer.addTo(map);
        districtsLayer.addTo(map);

        // Generic data loading function
        function loadGeoJSON(url, onsuccess) {
            fetch(url)
                .then(response => {
                    if (!response.ok) throw new Error(`Network response was not ok for ${url}`);
                    return response.json();
                })
                .then(data => onsuccess(data))
                .catch(error => console.error(`Error loading ${url}:`, error));
        }

        // MODIFICATION: Changed GeoJSON file name for profiles layer
        loadGeoJSON("Profiles_SV_4326_v4.geojson", data => profilesLayer.addData(data));
        loadGeoJSON('Decoupage_Administratif_4326.geojson', data => decoupageLayer.addData(data));
        loadGeoJSON('Districts_Electoraux_4326.geojson', data => districtsLayer.addData(data));
        loadGeoJSON('Affectation_Territoire_4326.geojson', data => affectationLayer.addData(data));
        
        // Load data for the grouped layers
        loadGeoJSON('ResultatsMairie2024_SV_4326.geojson', data => {
            groupedOverlays["Mairie 2024"]["Action Gatineau"].addData(data);
            groupedOverlays["Mairie 2024"]["Adversaires"].addData(data);
        });
        
        loadGeoJSON('ResultatsMairie2021_SV_4326.geojson', data => {
            groupedOverlays["Mairie 2021"]["Action Gatineau"].addData(data);
            groupedOverlays["Mairie 2021"]["Adversaires"].addData(data);
        });
        
        loadGeoJSON('ResultatsDistricts_2021_SV_4326.geojson', data => {
            groupedOverlays["Districts 2021"]["Action Gatineau"].addData(data);
            groupedOverlays["Districts 2021"]["Adversaires"].addData(data);
        });

        // --- Custom Legend Control ---
        // MODIFICATION: Added a custom legend control for choropleth layers.
        var legend = L.control({position: 'topright'}); // MODIFICATION: Changed position to 'topright'

        legend.onAdd = function (map) {
            var div = L.DomUtil.create('div', 'info legend');
            // MODIFICATION: Adjusted profilesColors to 7 steps for more granular legend
            var profilesColors = chroma.scale(['white', 'purple']).domain([0, 100]).colors(7); 
            var electionColors = chroma.scale(['#FFFFE0', '#FF4500']).domain([0, 1]).colors(5); // Example for Action Gatineau
            var electionAdversariesColors = chroma.scale(['#FFFFE0', '#4169E1']).domain([0, 1]).colors(5); // Example for Adversaries
            var affectationColors = {
				'Résidentielle': 'blue',
				'Commerciale artérielle': 'purple',
				'Industriel': 'red',
				'Récréative': 'lime',
				'Agricole': 'yellow',
				'Rurale': 'yellow',
				'Multifonctionnelle': 'aqua',
				'Économique spécialisée': 'teal',
				'Agricole de conservation': 'olive',
				'Conservation': 'green'
            };

            div.innerHTML += '<h4>Map Legend</h4>';

            // Profiles Layer Legend
            // MODIFICATION: Changed legend title and labels for profiles layer to reflect new bins
            div.innerHTML += '<h5>Profiles & Indice de Support</h5>';
            // Adjusted legend labels to provide more contrast within the 23-60 range
            var profilesLabels = ['0 - 22', '23 - 30', '31 - 38', '39 - 46', '47 - 54', '55 - 60', '61 - 100'];
            for (var i = 0; i < profilesColors.length; i++) {
                div.innerHTML +=
                    '<div class="legend-item">' +
                    '<i class="legend-color" style="background:' + profilesColors[i] + '"></i> ' +
                    '<span class="legend-label">' + profilesLabels[i] + '</span>' +
                    '</div>';
            }

            // Election Layers Legend (Action Gatineau)
            div.innerHTML += '<h5>Election Vote % (AG)</h5>';
            var electionLabels = ['0-20', '21-40', '41-60', '61-80', '81-100'];
            for (var i = 0; i < electionColors.length; i++) {
                div.innerHTML +=
                    '<div class="legend-item">' +
                    '<i class="legend-color" style="background:' + electionColors[i] + '"></i> ' +
                    '<span class="legend-label">' + electionLabels[i] + '</span>' +
                    '</div>';
            }

            // Election Layers Legend (Adversaries)
            div.innerHTML += '<h5>Election Vote % (Adversaries)</h5>';
            for (var i = 0; i < electionAdversariesColors.length; i++) {
                div.innerHTML +=
                    '<div class="legend-item">' +
                    '<i class="legend-color" style="background:' + electionAdversariesColors[i] + '"></i> ' +
                    '<span class="legend-label">' + electionLabels[i] + '</span>' +
                    '</div>';
            }

            // Affectation Territoire Legend
            div.innerHTML += '<h5>Affectation Territoire</h5>';
            for (var type in affectationColors) {
                div.innerHTML +=
                    '<div class="legend-item">' +
                    '<i class="legend-color" style="background:' + affectationColors[type] + '"></i> ' +
                    '<span class="legend-label">' + type + '</span>' +
                    '</div>';
            }

            return div;
        };

        legend.addTo(map);

    </script>
</body>
</html>
